# Delivery points configuration for DRL training
# These are target locations the robot should navigate to
# Each delivery has a deadline (in seconds) - the car must deliver on time

delivery_points:
  - id: 0
    name: "delivery_point_0"
    position:
      east: 200.0
      north: 50.0
      up: 0.0
    description: "First delivery point"
    deadline_seconds: 120.0  # Must deliver within 120 seconds (2 minutes)

