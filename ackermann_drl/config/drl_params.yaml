# DRL training parameters

drl:
  # Environment parameters
  env:
    max_episode_steps: 6500
    require_road_polygons: true
    sync_sensors: true
    sensor_timeout: 0.5
    sensor_poll: 0.01
    episodes_per_sim_restart: 50
    sim_restart_pause: 1.0

    # Collision handling
    collision:
      max_collisions: 3          # collisions allowed per episode before termination
      post_event_grace_steps: 5  # steps to keep running after a collision event
      stuck_time: 1.0            # seconds in continuous collision before termination
      lidar_threshold: 0.8       # meters for LiDAR collision trigger
      lidar_patience_steps: 2    # consecutive LiDAR hits to confirm collision
      offroad_patience_steps: 3  # consecutive off-road steps to confirm collision
      offroad_buffer_m: 0.0      # extra margin near curb contact
    
    # Low-level control shaping (rate limiter + smoothing)
    control:
      max_linear_accel: 1.5    # m/s^2
      max_angular_accel: 1.0   # rad/s^2
      smoothing_tau: 0.45      # seconds

    # Road rule checks
    road_rules:
      speed_limit_tolerance: 0.0        # m/s margin before penalty
      oneway_min_speed: 0.2             # m/s minimum to evaluate direction
      oneway_heading_tolerance_deg: 90  # degrees
    
    # Rewards (weights)
    rewards:
      w_progress: 2.0              # Reward per meter closer to goal (good)
      w_goal: 250.0               # Reward for reaching goal (increased from 200.0 for better signal)
      w_collision: -500.0          # Critical failure penalty (good)
      w_offroad: -5.0              # Penalty per meter off-road (good)
      w_obstacle_proximity: -7.0   # Warning for getting too close (good)
      w_path_deviation: -1.0       # Guidance to stay near road centerline (good)
      w_aggressive: -4.0           # Penalize sharp control changes (good)
      w_acceleration: -0.5         # Penalize high acceleration/braking (good)
      w_lateral_accel: -3.0        # Penalize high lateral acceleration (good)
      w_speeding: -2.0             # Penalize exceeding speed limit per m/s (good)
      w_oneway: -10.0              # Penalize driving against oneway (good)
      w_time: -0.01                # Time penalty per step (REDUCED from -0.15 to prevent domination)
      w_energy: -15.0              # Penalty for energy consumption (good)
      w_battery_conservation: -0.0 # Focus on consumption per step rather than total level (disabled)
      w_delivery_late: -2.0        # Penalty per second if deadline missed (good)
      w_reverse: -2.0              # Penalty for driving in reverse (good)
    
  # Action space
  action:
    max_linear_velocity: 2.0  # m/s
    max_angular_velocity: 1.0  # rad/s
    min_linear_velocity: -2.0  # m/s (reverse)
    min_angular_velocity: -1.0  # rad/s
    
  # Observation space
  observation:
    scan_samples: 720  # Number of LiDAR samples
    use_odom: true
    normalize_scan: true
    scan_max_range: 50.0  # meters
    
  # Training parameters
  training:
    total_timesteps: 1000000
    learning_rate: 3e-4
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    
  # Robot parameters
  robot:
    wheel_base: 0.2255  # meters
    wheel_separation: 0.2  # meters
    vehicle_width: 0.27  # meters (wheel separation + 2 * wheel radius)
    max_steering_angle: 0.4  # radians
