# DRL training parameters

drl:
  # Environment parameters
  env:
    max_episode_steps: 6500
    require_road_polygons: true
    sync_sensors: true
    sensor_timeout: 0.5
    sensor_poll: 0.01
    episodes_per_sim_restart: 50
    sim_restart_pause: 1.0
    
    # Low-level control shaping (rate limiter + smoothing)
    control:
      max_linear_accel: 1.5    # m/s^2
      max_angular_accel: 1.0   # rad/s^2
      smoothing_tau: 0.45      # seconds

    # Road rule checks
    road_rules:
      speed_limit_tolerance: 0.0        # m/s margin before penalty
      oneway_min_speed: 0.2             # m/s minimum to evaluate direction
      oneway_heading_tolerance_deg: 90  # degrees
    
    # Rewards (weights)
    rewards:
      w_progress: 2.0
      w_goal: 200.0
      w_collision: -500.0
      w_offroad: -5.0
      w_obstacle_proximity: -7.0
      w_path_deviation: -1.0
      w_aggressive: -4.0
      w_acceleration: -0.5
      w_lateral_accel: -3.0
      w_speeding: -2.0
      w_oneway: -10.0
      w_time: -0.15
      w_energy: -15.0
      w_battery_conservation: -0.0
      w_delivery_late: -2.0
      w_reverse: -2.0
    
  # Action space
  action:
    max_linear_velocity: 2.0  # m/s
    max_angular_velocity: 1.0  # rad/s
    min_linear_velocity: -2.0  # m/s (reverse)
    min_angular_velocity: -1.0  # rad/s
    
  # Observation space
  observation:
    scan_samples: 720  # Number of LiDAR samples
    use_odom: true
    normalize_scan: true
    scan_max_range: 50.0  # meters
    
  # Training parameters
  training:
    total_timesteps: 1000000
    learning_rate: 3e-4
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    
  # Robot parameters
  robot:
    wheel_base: 0.2255  # meters
    wheel_separation: 0.2  # meters
    vehicle_width: 0.27  # meters (wheel separation + 2 * wheel radius)
    max_steering_angle: 0.4  # radians
